<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Trident Studios</title>
  <meta name="robots" content="noindex, follow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet" />

  <script>
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        var forced = p.get('theme');
        var stored = localStorage.getItem('ts-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var t = forced || stored || (prefersDark ? 'dark' : 'light');
        if (t !== 'dark' && t !== 'light') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Absolute paths: a 404 can be served at any depth (/a/b/c), so relative
       hrefs would resolve against the missing path and break. -->
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/png" href="/public/Logos/tridentStudiosLogo-dark.png" />

  <style>
    .nf {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(32px, 8vw, 80px) var(--gutter);
      gap: clamp(18px, 3vw, 28px);
    }

    .nf__logo {
      width: clamp(84px, 12vw, 116px);
      height: auto;
      margin-bottom: clamp(8px, 2vw, 16px);
    }

    /* One logo file per theme — the dark mark disappears on the dark palette. */
    [data-theme="dark"] .nf__logo--dark { display: none; }
    [data-theme="light"] .nf__logo--light { display: none; }

    .nf__code {
      font-family: var(--sans);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--taupe);
      margin: 0;
    }

    .nf__title {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(2.1rem, 6vw, 3.6rem);
      line-height: 1.1;
      color: var(--ink);
      margin: 0;
    }

    .nf__body {
      font-family: var(--sans);
      font-weight: 300;
      font-size: clamp(0.95rem, 1.6vw, 1.05rem);
      line-height: 1.7;
      color: var(--ink-soft);
      max-width: 46ch;
      margin: 0;
    }

    .nf__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-top: clamp(6px, 1.5vw, 12px);
    }

    .nf__btn {
      font-family: var(--sans);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 14px 30px;
      border: 1px solid var(--gold);
      color: var(--gold-deep);
      background: transparent;
      transition: background 0.4s var(--ease), color 0.4s var(--ease);
    }

    .nf__btn:hover { background: var(--gold); color: var(--paper); }

    .nf__btn--solid {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper);
    }

    .nf__btn--solid:hover { background: var(--gold-deep); border-color: var(--gold-deep); }

    .nf__places {
      font-family: var(--sans);
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--taupe);
      margin: clamp(14px, 3vw, 26px) 0 0;
    }

    .nf__places a {
      color: var(--taupe);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      padding-bottom: 2px;
      margin: 0 8px;
      transition: color 0.3s var(--ease), border-color 0.3s var(--ease);
    }

    .nf__places a:hover { color: var(--gold-deep); border-color: var(--gold); }
  </style>
</head>

<body>
  <main class="nf">
    <a href="/" aria-label="Trident Studios home">
      <img class="nf__logo nf__logo--dark" src="/public/Logos/tridentStudiosLogo-dark.png"
        alt="Trident Studios" width="116" height="116" />
      <img class="nf__logo nf__logo--light" src="/public/Logos/tridentStudiosLogo-light.png"
        alt="Trident Studios" width="116" height="116" />
    </a>

    <p class="nf__code">Error 404</p>

    <h1 class="nf__title">This page has moved on.</h1>

    <p class="nf__body">
      The link you followed points somewhere that no longer exists — likely an older
      version of our site. Everything is still here, just in a new place.
    </p>

    <div class="nf__actions">
      <a class="nf__btn nf__btn--solid" href="/inquiry/">Inquire</a>
      <a class="nf__btn" href="/">View portfolio</a>
    </div>

    <p class="nf__places">
      <a href="/brandon/">Brandon</a>
      <a href="/winnipeg/">Winnipeg</a>
      <a href="/regina/">Regina</a>
    </p>
  </main>

  <script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
